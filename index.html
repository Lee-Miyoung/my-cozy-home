<script>
(()=>{'use strict';
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/>',list:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h9M8 14h9"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18"/><path d="M16 15h2"/>',book:'<path d="M12 7v14M3 5.5C6 4 9 4 12 6v15c-3-2-6-2-9-.5zM21 5.5c-3-1.5-6-1.5-9 .5v15c3-2 6-2 9-.5z"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v11H3Z"/>',palette:'<circle cx="12" cy="12" r="9"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="16" cy="9" r="1"/><path d="M13 21c-2-3 0-5 2-5h2a3 3 0 0 0 3-3"/>',phone:'<path d="M7 3H5a2 2 0 0 0-2 2c0 9 7 16 16 16a2 2 0 0 0 2-2v-2l-5-2-2 2a14 14 0 0 1-7-7l2-2Z"/>',tool:'<path d="M14 7a5 5 0 0 1 6.5-4.5L17 6l1 2 3.5-3.5A5 5 0 0 1 17 11L8 20a3 3 0 0 1-4-4Z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M4 9V7l3-2 2 1 2-3h2l2 3 2-1 3 2v3l-2 2 2 2v3l-3 2-2-1-2 3h-2l-2-3-2 1-3-2v-3l2-2z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',edit:'<path d="M4 20h4l12-12-4-4L4 16zM14 6l4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6"/>',check:'<path d="m4 12 5 5L20 6"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/>',upload:'<path d="M12 21V8m-5 5 5-5 5 5M4 6V3h16v3"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>'};
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" aria-hidden="true">${ICONS[name]||ICONS.home}</svg>`;
const STAGES=[{id:'land',name:'토지·권리',icon:'🌱',desc:'토지의 소유 관계, 경계, 건축 가능 조건을 확인해요.'},{id:'clear',name:'기존 집·철거',icon:'🏚️',desc:'건축물대장, 철거 절차, 슬레이트 지원을 챙겨요.'},{id:'design',name:'설계·계획',icon:'📐',desc:'건축사와 평면도, 구조, 공간, 예산을 그려요.'},{id:'permit',name:'인허가',icon:'📝',desc:'허가·신고와 관련 협의를 차례로 진행해요.'},{id:'contract',name:'견적·계약',icon:'🤝',desc:'시공사 견적 비교, 계약서, 일정 등을 확정해요.'},{id:'build',name:'착공·시공',icon:'🧱',desc:'기초, 골조, 설비, 단열, 마감 현장을 기록해요.'},{id:'finish',name:'준공·검사',icon:'🔑',desc:'사용승인, 점검, 보완, 각종 서류를 마무리해요.'},{id:'move',name:'입주·생활',icon:'🏡',desc:'입주 후 관리, 보증, 정원과 사계절을 기록해요.'}];
const CATS=['토지·세금','철거·폐기물','설계·감리','허가·인입','기초·골조','설비·전기','내외장·마감','가구·가전','조경·외부','기타'];
const NAV=[['home','홈','home'],['stages','집짓기 여정','list'],['budget','건축비 가계부','wallet'],['journal','오늘의 기록','book'],['files','서류 보관함','folder'],['design','디자인북','palette'],['contacts','현장 연락처','phone'],['care','집 관리수첩','tool'],['settings','설정·백업','settings']];
const pageTitle=Object.fromEntries(NAV.map(x=>[x[0],x[1]]));
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const localDate=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const compactMoney=n=>{n=Number(n||0);return n>=100000000?(n/100000000).toLocaleString('ko-KR',{maximumFractionDigits:2})+'억 원':n>=10000?(n/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만 원':money(n)};
const dateLabel=s=>{if(!s)return '일정 미정';const d=new Date(s+'T00:00:00');return isNaN(d)?esc(s):new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'short',day:'numeric'}).format(d)};
const getStage=s=>STAGES.find(x=>x.id===s)||STAGES[0];
const timestamp=()=>new Date().toISOString();
const blankSeed=[['land','토지 등기·소유권 및 지적도 확인'],['land','건축 가능 여부와 도로 접도 조건을 관할 부서에 확인'],['land','토지 이전 방법과 관련 세금 전문가 확인'],['clear','현장에 있는 건물과 건축물대장 대조'],['clear','미등기·누락 건축물 처리 절차 확인'],['clear','슬레이트 철거 지원 범위와 신청 서류 확인'],['clear','철거 후 멸실신고 및 증빙 확인'],['clear','기존 정화조 상태와 향후 오수처리 방식 확인'],['design','건축사 현장 상담 및 배치도 검토'],['design','희망 공간·평면 구성과 예산 정리'],['permit','관할 지자체 건축 인허가 필요사항 확인'],['contract','공종별 견적 비교 및 계약서 검토'],['build','착공 전 공정표와 현장 연락처 정리'],['finish','사용승인 및 건축물대장 등재 확인'],['move','설비 매뉴얼·보증서·유지관리 일정 모으기']];
function seed(){return {schema:1,project:{title:'우리 시골집',location:'',area:'27평 (계획)',target:'2027-09-30',description:'오래된 집의 기억 위에, 새로운 우리의 계절을 짓다.',budgetGoal:0},tasks:blankSeed.map(([stage,title])=>({id:id(),stage,title,status:'todo',due:'',memo:'',created:timestamp()})),expenses:[],journals:[],documents:[],designs:[],contacts:[],care:[]}};
let state,db,ui={page:'home',stage:'all',taskStatus:'all',budgetType:'all',journalType:'all',search:''},saveQueue=Promise.resolve(),objectURLs=new Map(),toastHandle=0,opening=false;
const store=(name,mode,fn)=>new Promise((resolve,reject)=>{if(!db){reject(new Error('저장소를 사용할 수 없습니다.'));return}let t;try{t=db.transaction(name,mode);const r=fn(t.objectStore(name));t.oncomplete=()=>resolve(r?.result);t.onerror=()=>reject(t.error||new Error('저장 실패'));t.onabort=()=>reject(t.error||new Error('저장 취소'))}catch(e){reject(e)}});
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(Error('IndexedDB 미지원'));let r=indexedDB.open('house_time_private_v1',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta');d.createObjectStore('attachments')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putFile(file){let blob=file;let fileName=file.name||'사진.jpg';let fileType=file.type||'application/octet-stream';if(file.size>30*1024*1024)throw Error('파일 한 개는 30MB 이하로 첨부해 주세요.');if(/^image\/(jpeg|png|webp)$/.test(fileType)&&file.size>250*1024){try{const result=await resizeImage(file);blob=result;fileName=fileName.replace(/\.[^.]+$/, '')+'.jpg';fileType='image/jpeg'}catch(e){/* HEIC 등 미지원 사진은 원본 보관 */}}
const fileId=id();await store('attachments','readwrite',s=>s.put({id:fileId,blob,name:fileName,type:fileType,size:blob.size,added:timestamp()},fileId));return {id:fileId,name:fileName,type:fileType,size:blob.size}}
function resizeImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,1800/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale);if(!w||!h){URL.revokeObjectURL(url);return reject(Error('invalid image'))}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(Error('image export failed'))},'image/jpeg',.82)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image unavailable'))};img.src=url})}
const getFile=fileId=>store('attachments','readonly',s=>s.get(fileId));
async function delFile(fileId){if(objectURLs.has(fileId)){URL.revokeObjectURL(objectURLs.get(fileId));objectURLs.delete(fileId)}await store('attachments','readwrite',s=>s.delete(fileId))}
function saveState(){const snapshot=JSON.parse(JSON.stringify(state));saveQueue=saveQueue.catch(()=>{}).then(()=>store('meta','readwrite',s=>s.put(snapshot,'state')));return saveQueue}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('show'),3200)}
function elButton(action,display,attrs=''){return `<button class="btn sm" data-action="${action}" ${attrs}>${display}</button>`}
function navLink(page,txt,clazz='btn sm'){return `<button class="${clazz}" data-nav="${page}">${txt}</button>`}
function mark(){return `<svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#52745a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15 16 5l13 10"/><path d="M7 13v14h18V13M13 27v-9h6v9"/><path d="M23 9V5h3v7"/><path d="M12 12h8"/></svg>`}
function renderNav(){const n=$('#railNav'),b=$('#bottomNav');n.innerHTML=NAV.map(([p,name,ic])=>`<button class="nav-btn ${ui.page===p?'active':''}" data-nav="${p}">${icon(ic)}<span>${name}</span></button>`).join('');const mini=[['home','홈','home'],['stages','여정','list'],['budget','가계부','wallet'],['journal','기록','book'],['more','더보기','more']];b.innerHTML=mini.map(([p,name,ic])=>`<button class="${ui.page===p||p==='more'&&!mini.some(x=>x[0]===ui.page)?'active':''}" data-nav="${p}">${icon(ic,21)}<span>${name}</span></button>`).join('')}
function stageProgress(s){const rows=state.tasks.filter(t=>t.stage===s);return {total:rows.length,done:rows.filter(t=>t.status==='done').length,pct:rows.length?Math.round(rows.filter(t=>t.status==='done').length/rows.length*100):0}}
function overall(){const done=state.tasks.filter(x=>x.status==='done').length;return {total:state.tasks.length,done,pct:state.tasks.length?Math.round(done/state.tasks.length*100):0}}
function totals(){const sum=type=>state.expenses.filter(e=>e.type===type).reduce((a,e)=>a+Number(e.amount||0),0);return {estimate:sum('estimate'),contract:sum('contract'),paid:sum('payment')}}
function heading(title,subtitle='',actions=''){return `<div class="page-intro"><div><div class="eyebrow">OUR HOME STORY</div><h1>${title}</h1>${subtitle?`<p class="muted small">${subtitle}</p>`:''}</div><div class="button-line">${actions}</div></div>`}
function sectionHeading(title,subtitle='',action=''){return `<div class="section-heading"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div>`}
function empty(icon_,title,body,action=''){return `<div class="empty"><div class="empty-icon">${icon_}</div><strong>${title}</strong><p>${body}</p>${action}</div>`}
function houseArt(){return `<svg viewBox="0 0 490 330" role="img" aria-label="초록 언덕에 자리한 작은 시골집 그림" preserveAspectRatio="xMidYMax meet"><defs><linearGradient id="hill" x1="0" x2="1"><stop stop-color="#c3d4b6"/><stop offset="1" stop-color="#afc6a6"/></linearGradient><linearGradient id="roof" x1="0" x2="1"><stop stop-color="#899b83"/><stop offset="1" stop-color="#687e6e"/></linearGradient></defs><circle cx="356" cy="88" r="44" fill="#efe1b5" opacity=".62"/><path d="M5 275Q120 217 210 263T499 233V330H0Z" fill="#d9e4d1"/><path d="M0 303Q137 259 248 297T490 279V330H0Z" fill="url(#hill)"/><g opacity=".7"><path d="M59 282V207M46 223q12-33 28-6M42 242q18-30 35-7" stroke="#779882" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="53" cy="205" r="27" fill="#bbcead"/><circle cx="71" cy="225" r="23" fill="#a5c19e"/><circle cx="44" cy="227" r="24" fill="#c4d3b4"/></g><g><path d="M194 174 310 102l123 72v118H194Z" fill="#f7f4e9"/><path d="M175 179 311 96l137 83-8 11-129-77-129 77Z" fill="url(#roof)"/><path d="M230 198h46v61h-46zM340 197h51v61h-51z" fill="#93b6ad"/><path d="M253 198v61M230 230h46M365 198v61M340 229h51" stroke="#e9e4d3" stroke-width="5"/><path d="M294 217h33v75h-33Z" fill="#ae8e73"/><circle cx="319" cy="256" r="2" fill="#efdfbb"/><path d="M190 289h247" stroke="#d7d1bd" stroke-width="6"/></g><g opacity=".86"><path d="M124 306v-43M110 287q12-17 21-1M138 310v-24" stroke="#7d9d7c" stroke-width="3"/><circle cx="122" cy="267" r="7" fill="#d5a68d"/><circle cx="142" cy="283" r="6" fill="#e4bd86"/><circle cx="112" cy="289" r="5" fill="#e2b4a0"/><path d="M455 322v-50M442 295q11-15 26-4" stroke="#789778" stroke-width="4"/><circle cx="454" cy="275" r="11" fill="#efd9b4"/><circle cx="440" cy="295" r="6" fill="#c69788"/></g><path d="M0 324Q91 312 199 326T490 319" stroke="#91af8e" stroke-width="4" fill="none"/></svg>`}
function taskRow(t,editable=true){const done=t.status==='done',late=t.due&&!done&&t.due<localDate();return `<div class="task-row"><button class="check ${done?'checked':''}" aria-label="${done?'완료 취소':'할 일 완료'}" data-action="toggle-task" data-id="${t.id}">${done?icon('check',15):''}</button><div style="flex:1;min-width:0"><div class="task-title ${done?'complete':''}">${esc(t.title)}</div><div class="task-meta">${esc(getStage(t.stage).name)}${t.due?' · '+dateLabel(t.due):''}${late?' · <span style="color:#b46251">일정 경과</span>':''}${t.memo?' · 메모 있음':''}</div></div>${editable?`<div class="task-actions"><button class="icon-btn" aria-label="수정" data-open="task" data-id="${t.id}">${icon('edit',16)}</button><button class="icon-btn" aria-label="삭제" data-action="delete" data-kind="tasks" data-id="${t.id}">${icon('trash',16)}</button></div>`:''}</div>`}
function home(){const o=overall(),t=totals(),current=STAGES.find(s=>stageProgress(s.id).done<stageProgress(s.id).total)||STAGES[STAGES.length-1];const pending=state.tasks.filter(x=>x.status!=='done').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);const recent=state.journals.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return `<section class="hero"><div class="hero-content"><div class="eyebrow">A LITTLE HOME, A BIG STORY</div><h1>${esc(state.project.title)}의 시간</h1><p>${esc(state.project.description||'한 채의 집이 완성되는 순간까지, 우리의 모든 이야기를 담아요.')}</p><div class="button-line"><button class="btn primary" data-open="journal">${icon('plus',15)} 오늘 기록하기</button><button class="btn" data-nav="stages">건축 여정 보기 ${icon('arrow',14)}</button></div></div><div class="hero-art">${houseArt()}</div><div class="hero-deco">A place to call home</div></section>
<div class="stats-grid"><div class="card stat"><div class="stat-label">집짓기 할 일 진행률</div><div class="stat-value green">${o.pct}%</div><div class="stat-bottom">${o.done}/${o.total}개 완료</div></div><div class="card stat"><div class="stat-label">예상 건축비 기록</div><div class="stat-value">${compactMoney(t.estimate)}</div><div class="stat-bottom">예상 견적 합계</div></div><div class="card stat"><div class="stat-label">실제 지출 기록</div><div class="stat-value">${compactMoney(t.paid)}</div><div class="stat-bottom">지급한 금액 합계</div></div><div class="card stat"><div class="stat-label">입주 목표일</div><div class="stat-value" style="font-size:20px">${state.project.target?esc(state.project.target.replaceAll('-','.')):'미정'}</div><div class="stat-bottom">${esc(state.project.area||'규모 미정')} · ${state.project.location?esc(state.project.location):'지역 미입력'}</div></div></div>
<div class="section-block split"><section class="card pane"><div class="pane-heading"><h3>우리 집 건축 여정</h3>${navLink('stages','단계별 보기 →','btn ghost sm')}</div><div class="muted small">현재 관심 단계 · ${esc(current.name)}</div><div class="progress-large"><b>${o.pct}</b><span>% 완료</span></div><div class="progress-track"><div style="width:${o.pct}%"></div></div><div class="stage-ticks">${STAGES.map(s=>{const a=stageProgress(s.id);return `<div class="stage-tick ${a.total&&a.done===a.total?'done':s.id===current.id?'current':''}"><div class="tick-bar"></div>${esc(s.name.split('·')[0])}</div>`}).join('')}</div><div class="section-note">할 일 체크 기준으로 진행률이 계산돼요. 행정절차 승인 여부를 뜻하지 않습니다.</div></section><section class="card pane"><div class="pane-heading"><h3>앞으로 할 일</h3><button class="btn sm" data-open="task">＋ 추가</button></div>${pending.length?`<div class="task-list">${pending.map(x=>taskRow(x,false)).join('')}</div>${navLink('stages','전체 할 일 보기 →','btn ghost sm')}`:empty('🌿','할 일을 모두 완료했어요','새로운 집짓기 일정을 등록해 보세요.',`<button class="btn sm" data-open="task">할 일 추가</button>`)}</section></div>
<div class="section-block split"><section class="card pane"><div class="pane-heading"><h3>최근 집짓기 기록</h3><button class="btn sm" data-open="journal">＋ 기록</button></div>${recent.length?recent.map(j=>`<div class="list-row"><div><span class="muted small">${dateLabel(j.date)} · ${esc(j.type)}</span><div><strong>${esc(j.title)}</strong></div></div><button class="btn ghost sm" data-nav="journal">보기 →</button></div>`).join(''):empty('📖','아직 기록이 없어요','현장 방문, 통화, 작은 결정도 소중한 기록이 돼요.',`<button class="btn sm" data-open="journal">첫 기록 남기기</button>`)}</section><section class="card pane"><div class="pane-heading"><h3>우리 집의 자료</h3>${navLink('files','보관함 →','btn ghost sm')}</div><div class="list-row"><strong>서류와 파일</strong><span class="chip green">${state.documents.length}개</span></div><div class="list-row"><strong>인테리어 선택 기록</strong><span class="chip green">${state.designs.length}개</span></div><div class="list-row"><strong>현장 연락처</strong><span class="chip green">${state.contacts.length}개</span></div><div class="list-row"><strong>사진이 있는 일기</strong><span class="chip green">${state.journals.filter(x=>(x.photos||[]).length).length}개</span></div><div class="button-line" style="margin-top:16px"><button class="btn sm" data-open="document">＋ 서류</button><button class="btn sm" data-open="design">＋ 자재·아이디어</button></div></section></div>`}
function stages(){const tasks=state.tasks.filter(t=>(ui.stage==='all'||t.stage===ui.stage)&&(ui.taskStatus==='all'||t.status===ui.taskStatus)).sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999'));return `${heading('집짓기 여정','토지 준비부터 입주까지, 8단계를 하나씩 채워가요.',`<button class="btn primary" data-open="task">＋ 할 일 추가</button>`)}<div class="stage-grid">${STAGES.map((s,i)=>{const p=stageProgress(s.id);return `<article class="card stage-card"><div class="stage-heading"><span class="stage-num">0${i+1}</span><h3>${s.name}</h3><div class="stage-icon">${s.icon}</div></div><p class="desc">${s.desc}</p><div class="progress-track"><div style="width:${p.pct}%"></div></div><div class="stage-card-foot"><span>${p.done}/${p.total}개 완료</span><button class="btn ghost sm" data-action="focus-stage" data-stage="${s.id}">할 일 보기 →</button></div></article>`}).join('')}</div><section class="section-block">${sectionHeading('단계별 체크리스트','일정을 입력하고 완료하면 자동으로 진행률에 반영돼요.',`<button class="btn" data-open="task">＋ 새 할 일</button>`)}<div class="card pane"><div class="task-tools" style="margin-bottom:15px"><select class="select-control" data-filter="stage" aria-label="단계 필터"><option value="all">전체 단계</option>${STAGES.map(s=>`<option value="${s.id}" ${s.id===ui.stage?'selected':''}>${s.name}</option>`).join('')}</select><div class="filter-chips">${[['all','전체'],['todo','진행 전'],['doing','진행 중'],['done','완료']].map(([key,label])=>`<button class="filter-pill ${ui.taskStatus===key?'on':''}" data-action="task-filter" data-value="${key}">${label}</button>`).join('')}</div></div>${tasks.length?tasks.map(t=>taskRow(t)).join(''):empty('☑️','조건에 맞는 할 일이 없어요','필터를 바꾸거나 새 할 일을 추가해 보세요.')}</div></section>`}
const TYPE={estimate:['예상 견적','amber'],contract:['계약','blue'],payment:['실제 지급','green']};
function budget(){const t=totals(),expenses=state.expenses.filter(e=>ui.budgetType==='all'||e.type===ui.budgetType).slice().sort((a,b)=>b.date.localeCompare(a.date));const cats=CATS.map(c=>({name:c,paid:state.expenses.filter(e=>e.type==='payment'&&e.category===c).reduce((v,x)=>v+x.amount,0)})).filter(x=>x.paid>0).sort((a,b)=>b.paid-a.paid);const max=Math.max(1,...cats.map(x=>x.paid));return `${heading('건축비 가계부','예상 견적·계약금액·실제 지급을 따로 기록하면 비용 흐름이 선명해져요.',`<button class="btn primary" data-open="expense">＋ 금액 기록</button>`)}<div class="expense-grid"><div class="card"><span class="muted small">예상 견적 총액</span><div class="big-number">${compactMoney(t.estimate)}</div><div class="small muted">견적 항목의 합계</div></div><div class="card"><span class="muted small">계약금액 합계</span><div class="big-number">${compactMoney(t.contract)}</div><div class="small muted">체결한 계약의 합계</div></div><div class="card"><span class="muted small">실제 지급액</span><div class="big-number" style="color:var(--green)">${compactMoney(t.paid)}</div><div class="small muted">계약 대비 단순 차액 ${compactMoney(t.contract-t.paid)}</div></div></div>${state.project.budgetGoal?`<div class="banner" style="margin-bottom:21px">설정한 총예산 ${money(state.project.budgetGoal)} · 실제 지급액 ${Math.round(t.paid/state.project.budgetGoal*100)}% (계약 외 비용은 별도 확인 필요)</div>`:''}<div class="financial-grid"><section class="card" style="overflow:hidden"><div class="pane-heading" style="padding:22px 22px 6px"><h3>건축비 상세 내역</h3><select class="select-control" data-filter="budgetType"><option value="all">전체 유형</option>${Object.entries(TYPE).map(([k,v])=>`<option value="${k}" ${ui.budgetType===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>${expenses.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>날짜 / 내역</th><th>구분</th><th>분류</th><th style="text-align:right">금액</th><th>관리</th></tr></thead><tbody>${expenses.map(e=>`<tr><td><div class="muted small">${dateLabel(e.date)}</div><strong>${esc(e.title)}</strong>${e.vendor?`<div class="muted small">${esc(e.vendor)}</div>`:''}${e.memo?`<div class="muted small">${esc(e.memo)}</div>`:''}</td><td><span class="chip ${TYPE[e.type][1]}">${TYPE[e.type][0]}</span></td><td>${esc(e.category)}</td><td style="text-align:right"><span class="money">${money(e.amount)}</span></td><td class="actions"><button class="icon-btn" data-open="expense" data-id="${e.id}" aria-label="수정">${icon('edit',16)}</button><button class="icon-btn" data-action="delete" data-kind="expenses" data-id="${e.id}" aria-label="삭제">${icon('trash',16)}</button></td></tr>`).join('')}</tbody></table></div>`:empty('₩','아직 등록한 건축비가 없어요','견적과 실제 지급액을 따로 적어보세요.',`<button class="btn sm" data-open="expense">첫 금액 기록</button>`)}</section><aside class="card pane"><div class="pane-heading"><h3>분류별 지급 현황</h3><span class="muted small">실제 지급 기준</span></div>${cats.length?cats.map(c=>`<div class="category-bar"><div class="bar-meta"><span>${esc(c.name)}</span><strong>${compactMoney(c.paid)}</strong></div><div class="bar-rail"><div class="bar-fill" style="width:${Math.round(c.paid/max*100)}%"></div></div></div>`).join(''):empty('🌿','지급 내역 없음','실제 지급을 입력하면 분류별로 보여드려요.')}<div class="section-note">※ 계약 합계와 지급 합계는 서로 다른 내역의 단순 합계입니다. 업체별 잔금 확정 또는 세금 신고 계산표로 사용하지 마세요.</div></aside></div>`}
function journal(){const rows=state.journals.filter(x=>ui.journalType==='all'||x.type===ui.journalType).sort((a,b)=>b.date.localeCompare(a.date));return `${heading('오늘의 기록','현장의 사진, 문의한 내용, 중요한 결정을 일기처럼 남겨요.',`<button class="btn primary" data-open="journal">＋ 새 기록</button>`)}<div class="filter-chips" style="margin-bottom:20px">${[['all','모든 기록'],['현장일기','🏡 현장일기'],['통화·문의','☎ 통화·문의'],['결정기록','✦ 결정기록']].map(([k,n])=>`<button class="filter-pill ${ui.journalType===k?'on':''}" data-action="journal-filter" data-value="${k}">${n}</button>`).join('')}</div><div class="entry-list">${rows.length?rows.map(e=>`<article class="card entry"><div class="entry-head"><div><div class="entry-date">${dateLabel(e.date)} <span class="chip green">${esc(e.type)}</span></div><h3>${esc(e.title)}</h3><div class="muted small" style="margin-bottom:8px">${esc(getStage(e.stage).name)}</div></div><div class="button-line"><button class="icon-btn" data-open="journal" data-id="${e.id}" aria-label="수정">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="journals" data-id="${e.id}" aria-label="삭제">${icon('trash')}</button></div></div><p>${esc(e.body)}</p>${(e.photos||[]).length?`<div class="photo-grid">${e.photos.map(ph=>`<button class="photo-thumb" data-action="preview-file" data-id="${ph.id}" aria-label="사진 열기"><img data-blob="${ph.id}" alt="${esc(ph.name)}"><span class="thumb-fallback hidden">사진</span></button>`).join('')}</div>`:''}</article>`).join(''):empty('📷','우리 집의 첫 기록을 시작해요','오래된 집의 모습이나 관할 기관과 통화한 내용을 남겨보세요.',`<button class="btn primary" data-open="journal">첫 번째 기록 쓰기</button>`)}</div>`}
function files(){let docs=state.documents.slice().sort((a,b)=>b.added.localeCompare(a.added));return `${heading('서류 보관함','문서와 도면 원본을 보관하고, 어떤 단계의 자료인지 함께 기록해요.',`<button class="btn primary" data-open="document">＋ 파일 올리기</button>`)}<div class="banner warning" style="margin-bottom:21px"><h3>나만의 기기에 저장됩니다</h3><p>파일은 이 브라우저의 저장 공간에 저장돼요. GitHub 저장소로 자동 업로드되지 않으며, 다른 기기에서 바로 보이지 않아요. 중요한 서류는 원본도 별도로 보관하고, 설정에서 정기적으로 백업해 주세요.</p></div><div class="document-grid">${docs.length?docs.map(d=>`<article class="card doc-card"><div class="file-type">${/^image\//.test(d.file?.type||'')?'🖼️':/pdf/.test(d.file?.type||'')?'📑':'📁'}</div><div class="doc-details"><span class="chip green">${esc(d.category)}</span><h3 style="margin-top:7px">${esc(d.title)}</h3><p>${esc(d.file?.name||'파일 없음')} · ${dateLabel(d.added.slice(0,10))}</p>${d.memo?`<p style="color:#747f72">${esc(d.memo)}</p>`:''}<div class="doc-actions"><button class="btn sm" data-action="download-file" data-id="${d.file?.id||''}">${icon('download',14)} 열기/저장</button><button class="btn sm" data-open="document" data-id="${d.id}">수정</button><button class="btn sm danger" data-action="delete" data-kind="documents" data-id="${d.id}">삭제</button></div></div></article>`).join(''):empty('🗂️','아직 문서가 없어요','건축물대장, 지적도, 허가서, 계약서 등을 등록해 보세요.',`<button class="btn primary" data-open="document">첫 문서 보관</button>`)}</div>`}
function designs(){const rows=state.designs.slice().sort((a,b)=>b.created.localeCompare(a.created));return `${heading('꿈꾸는 우리 집','마루, 주방, 욕실, 조명 등 마음에 든 제품과 최종 결정을 모아요.',`<button class="btn primary" data-open="design">＋ 아이디어 추가</button>`)}<div class="design-grid">${rows.length?rows.map(d=>`<article class="card design-card"><div class="design-visual">${d.photo?`<img data-blob="${d.photo.id}" alt="${esc(d.title)}">`:({'거실':'🛋️','주방':'🍽️','침실':'🛏️','욕실':'🛁','마당':'🌼','외관':'🏠'}[d.space]||'✦')}</div><div class="design-body"><div class="button-line"><span class="chip">${esc(d.space)}</span><span class="chip ${d.status==='확정'?'green':'amber'}">${esc(d.status)}</span></div><h3>${esc(d.title)}</h3>${d.price?`<div class="money small">${money(d.price)}</div>`:''}${d.note?`<p class="text-note">${esc(d.note)}</p>`:''}${/^https?:\/\//i.test(d.link||'')?`<a href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">제품/참고 링크 ↗</a>`:''}<div class="button-line" style="margin-top:14px"><button class="btn sm" data-open="design" data-id="${d.id}">수정</button><button class="btn sm danger" data-action="delete" data-kind="designs" data-id="${d.id}">삭제</button></div></div></article>`).join(''):empty('🎨','취향을 하나씩 모아볼까요?','희망하는 인테리어 사진과 선택한 자재를 기록해 보세요.',`<button class="btn primary" data-open="design">첫 아이디어 저장</button>`)}</div>`}
function contacts(){return `${heading('현장 연락처','건축사, 시공사, 관공서 담당자 등 통화 기록에 필요한 연락처를 모아요.',`<button class="btn primary" data-open="contact">＋ 연락처 추가</button>`)}<div class="contact-grid">${state.contacts.length?state.contacts.map(c=>`<article class="card contact-card"><div class="chip green" style="display:inline-flex">${esc(c.category)}</div><h3>${esc(c.name)}</h3><div class="muted small">${esc(c.person||'')}</div>${c.phone?`<p style="margin:9px 0"><a href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">${icon('phone',14)} ${esc(c.phone)}</a></p>`:''}${c.note?`<p class="muted small" style="white-space:pre-wrap">${esc(c.note)}</p>`:''}<div class="button-line" style="margin-top:15px"><button class="btn sm" data-open="contact" data-id="${c.id}">수정</button><button class="btn sm danger" data-action="delete" data-kind="contacts" data-id="${c.id}">삭제</button></div></article>`).join(''):empty('☎','연락처가 비어 있어요','문의한 기관, 업체, 담당자의 연락처를 저장해 보세요.',`<button class="btn primary" data-open="contact">등록하기</button>`)}</div>`}
function care(){const rows=state.care.slice().sort((a,b)=>(a.done===true)-(b.done===true)||(a.due||'9999').localeCompare(b.due||'9999'));return `${heading('집 관리수첩','완공한 뒤에도 보증, 정화조, 보일러, 정원 관리를 이어가요.',`<button class="btn primary" data-open="care">＋ 관리 일정</button>`)}<div class="care-grid">${rows.length?rows.map(x=>`<article class="card care-card"><div class="button-line"><span class="chip ${x.done?'green':x.due&&x.due<localDate()?'red':'amber'}">${x.done?'완료':x.due&&x.due<localDate()?'일정 경과':'예정'}</span><span class="muted small">${dateLabel(x.due)}</span></div><h3>${esc(x.title)}</h3>${x.provider?`<p>담당: ${esc(x.provider)}</p>`:''}${x.note?`<p>${esc(x.note)}</p>`:''}<div class="button-line" style="margin-top:15px"><button class="btn sm" data-action="toggle-care" data-id="${x.id}">${x.done?'미완료로':'완료 표시'}</button><button class="btn sm" data-open="care" data-id="${x.id}">수정</button><button class="btn sm danger" data-action="delete" data-kind="care" data-id="${x.id}">삭제</button></div></article>`).join(''):empty('🪴','우리 집 관리일정을 정리해요','입주 전에 등록해 두어도 좋아요. 자동 알림 기능은 제공되지 않아요.',`<button class="btn primary" data-open="care">관리 일정 추가</button>`)}</div>`}
function settings(){const t=totals();return `${heading('설정과 백업','우리 집 기본정보를 수정하고, 데이터를 안전하게 보관해요.') }<div class="settings-grid"><section class="card settings-card"><h3>🏡 우리 집 기본 정보</h3><p><strong>${esc(state.project.title)}</strong><br>${esc(state.project.area||'규모 미입력')} · ${esc(state.project.location||'지역 미입력')}<br>목표 ${dateLabel(state.project.target)}</p><button class="btn primary" data-open="project">기본 정보 수정</button></section><section class="card settings-card"><h3>💾 전체 기록 백업</h3><p>할 일, 예산, 일기, 연락처, 등록한 사진·문서를 하나의 JSON 백업 파일로 내려받아요.</p><button class="btn primary" data-action="backup">${icon('download',15)} 전체 데이터 백업</button><span class="small muted">사진과 원본 파일이 많으면 백업 크기가 커져요.</span></section><section class="card settings-card"><h3>📥 백업 파일 복원</h3><p>다른 기기로 옮기거나 기록을 되살릴 때 사용해요. <strong>복원하면 이 기기에 현재 저장된 기록이 모두 교체됩니다.</strong></p><button class="btn" data-action="restore">${icon('upload',15)} JSON 백업 불러오기</button><span class="small muted">복원 전에는 기존 기록도 백업해 두세요.</span></section><section class="card settings-card"><h3>🔐 개인정보와 저장 방식</h3><p>현재 버전은 계정 로그인과 클라우드 동기화가 없는 개인용 앱이에요. 이 브라우저의 IndexedDB에만 저장되므로 다른 기기에는 자동으로 연결되지 않습니다. 브라우저 데이터 삭제·시크릿 모드·기기 변경 시 자료가 사라질 수 있어요.</p><span class="small muted">GitHub에는 index.html 코드만 올리고, 개인 문서·사진·백업 JSON은 절대 공개 업로드하지 마세요.</span></section></div><div class="banner" style="margin-top:20px"><h3>우리 집 비용 요약</h3><p>예상 견적 ${money(t.estimate)} · 계약 총액 ${money(t.contract)} · 실제 지급 ${money(t.paid)} · 기준 예산 ${state.project.budgetGoal?money(state.project.budgetGoal):'미설정'}</p></div>`}

case 'journal':return selectField('기록 종류','type',['현장일기','통화·문의','결정기록'],e.type||'현장일기')+selectField('진행 단계','stage',stageOpts,e.stage||'land')+field('기록 날짜','date',e.date||localDate(),'date','required')+field('제목 *','title',e.title,'text','required maxlength="140"')+textarea('오늘 있었던 일 / 담당자 답변 / 결정 내용 *','body',e.body)+fileField('현장 사진 추가 (여러 장 가능)','photos',true,'image/*')+existingPhotos(e.photos||[],kind,e.id);

case 'design':return selectField('공간','space',['외관','거실','주방','침실','욕실','마당','다용도실','기타'],e.space||'거실')+selectField('선택 상태','status',['후보','확정'],e.status||'후보')+field('제품/아이디어 이름 *','title',e.title,'text','required maxlength="140"',true)+field('참고 가격(원)','price',e.price||'','number','min="0" step="1"')+field('링크 (선택)','link',e.link||'','url','placeholder="https://..."')+textarea('장점·단점·선택 이유','note',e.note)+fileField(e.photo?'새 사진을 선택하면 기존 사진 교체':'이미지 추가','photo',false,'image/*');
case 'contact':return selectField('연락처 분류','category',['관공서','건축사·감리','시공사','철거·폐기물','설비·인입','자재·인테리어','기타'],e.category||'관공서')+field('기관 또는 업체명 *','name',e.name,'text','required maxlength="120"')+field('담당자 이름','person',e.person)+field('전화번호','phone',e.phone,'tel')+textarea('통화 가능 시간·특이사항','note',e.note);
case 'care':return field('관리 항목 *','title',e.title,'text','required maxlength="120"',true)+field('점검·관리 예정일','due',e.due,'date')+field('관련 업체','provider',e.provider)+textarea('관리 방법·보증 내용','note',e.note);

default:return ''}}
function existingPhotos(photos,kind,entryId){if(!photos?.length)return '';return `<div class="field full"><label>첨부된 사진 (${photos.length}장)</label><div class="existing-photos">${photos.map(p=>`<div class="existing-photo"><img data-blob="${p.id}" alt="기존 사진"><button type="button" title="이 사진만 삭제" data-action="delete-photo" data-kind="${kind}" data-entry="${entryId}" data-id="${p.id}">×</button></div>`).join('')}</div></div>`}
const kindTitle={task:'할 일',expense:'건축비',journal:'오늘의 기록',document:'문서',design:'인테리어 아이디어',contact:'연락처',care:'관리 일정',project:'우리 집 정보'};

function openModal(kind,itemId){if(opening)return;const entry=kind==='project'?state.project:itemId?state[kindStore[kind]]?.find(x=>x.id===itemId):{};if(!entry){toast('기록을 찾을 수 없습니다.');return}$('#modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${kindTitle[kind]} ${itemId?'수정':'추가'}"><div class="modal-header"><h2>${kindTitle[kind]} ${itemId||kind==='project'?'수정':'추가'}</h2><button class="icon-btn" data-action="close-modal" aria-label="닫기">${icon('close',21)}</button></div><div class="modal-body"><form data-form="${kind}" data-id="${esc(itemId||'')}"><div class="form-grid">${modalHTML(kind,entry)}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">취소</button><button type="submit" class="btn primary">저장하기</button></div></form></div></div>`;$('#modalRoot').classList.remove('hidden');document.body.style.overflow='hidden';loadImgs();$('#modalRoot').querySelector('input:not([disabled]),select,textarea')?.focus({preventScroll:true})}
function closeModal(){$('#modalRoot').classList.add('hidden');$('#modalRoot').innerHTML='';document.body.style.overflow=''}
const str=(fd,k)=>(fd.get(k)||'').toString().trim();
const number=(fd,k)=>{let n=Number(str(fd,k)||0);return Number.isFinite(n)&&n>=0?Math.round(n):0};
async function onForm(form){const kind=form.dataset.form,key=form.dataset.id;const fd=new FormData(form);const arr=kindStore[kind];const existing=key&&arr?state[arr].find(x=>x.id===key):null;const b=form.querySelector('[type=submit]');b.disabled=true;b.textContent='저장 중…';try{let e={...(existing||{}),id:existing?.id||id(),created:existing?.created||timestamp()};if(kind==='task')Object.assign(e,{stage:str(fd,'stage'),title:str(fd,'title'),status:str(fd,'status'),due:str(fd,'due'),memo:str(fd,'memo')});if(kind==='expense')Object.assign(e,{type:str(fd,'type'),category:str(fd,'category'),title:str(fd,'title'),amount:number(fd,'amount'),date:str(fd,'date'),vendor:str(fd,'vendor'),memo:str(fd,'memo')});if(kind==='journal'){Object.assign(e,{type:str(fd,'type'),stage:str(fd,'stage'),title:str(fd,'title'),date:str(fd,'date'),body:str(fd,'body'),photos:e.photos||[]});for(const f of fd.getAll('photos'))if(f instanceof File&&f.size){const a=await putFile(f);e.photos.push(a)}}
if(kind==='document'){Object.assign(e,{title:str(fd,'title'),category:str(fd,'category'),memo:str(fd,'memo'),added:existing?.added||timestamp()});const f=fd.get('file');if(f instanceof File&&f.size){const newFile=await putFile(f);if(e.file?.id)await delFile(e.file.id);e.file=newFile}if(!e.file)throw Error('첨부 파일을 선택해 주세요.')}
if(kind==='design'){Object.assign(e,{space:str(fd,'space'),status:str(fd,'status'),title:str(fd,'title'),price:number(fd,'price'),link:str(fd,'link'),note:str(fd,'note')});const f=fd.get('photo');if(f instanceof File&&f.size){const newPhoto=await putFile(f);if(e.photo?.id)await delFile(e.photo.id);e.photo=newPhoto}}
if(kind==='contact')Object.assign(e,{category:str(fd,'category'),name:str(fd,'name'),person:str(fd,'person'),phone:str(fd,'phone'),note:str(fd,'note')});
if(kind==='care')Object.assign(e,{title:str(fd,'title'),due:str(fd,'due'),provider:str(fd,'provider'),note:str(fd,'note'),done:e.done||false});
if(kind==='project'){state.project={title:str(fd,'title'),location:str(fd,'location'),area:str(fd,'area'),target:str(fd,'target'),budgetGoal:number(fd,'budgetGoal'),description:str(fd,'description')};if(!state.project.title)throw Error('집 이름을 입력해 주세요.')}else{if(existing){state[arr]=state[arr].map(x=>x.id===key?e:x)}else state[arr].unshift(e)}
await saveState();closeModal();render();toast('저장했어요.');}catch(err){console.error(err);toast(err.message||'저장하지 못했어요.')}finally{b.disabled=false;b.textContent='저장하기'}}
async function deleteRow(kind,key){const arr=state[kind],item=arr?.find(x=>x.id===key);if(!item)return;if(!confirm('이 기록을 삭제할까요? 첨부 파일도 함께 삭제됩니다.'))return;try{if(kind==='documents'&&item.file?.id)await delFile(item.file.id);if(kind==='journals')for(const ph of item.photos||[])await delFile(ph.id);if(kind==='designs'&&item.photo?.id)await delFile(item.photo.id);state[kind]=arr.filter(x=>x.id!==key);await saveState();render();toast('삭제했어요.')}catch(e){toast('삭제에 실패했어요.')}}
async function downloadFile(fileId){try{const item=await getFile(fileId);if(!item)throw Error('파일을 찾을 수 없어요.');const url=URL.createObjectURL(item.blob),a=document.createElement('a');a.href=url;a.download=item.name||'첨부파일';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}catch(e){toast(e.message)}}
async function previewFile(fileId){try{const f=await getFile(fileId);if(!f)throw Error('사진이 없습니다.');const url=objectURLs.get(fileId)||URL.createObjectURL(f.blob);objectURLs.set(fileId,url);$('#modalRoot').innerHTML=`<div class="viewer-modal"><button class="viewer-close" data-action="close-modal" aria-label="닫기">×</button><div style="clear:both"><img class="viewer" src="${url}" alt="${esc(f.name)}"></div></div>`;$('#modalRoot').classList.remove('hidden');document.body.style.overflow='hidden'}catch(e){toast(e.message)}}
async function deletePhoto(entryId,fileId){const item=state.journals.find(x=>x.id===entryId);if(!item||!confirm('이 사진만 삭제할까요?'))return;await delFile(fileId);item.photos=(item.photos||[]).filter(x=>x.id!==fileId);await saveState();openModal('journal',entryId);render();toast('사진을 삭제했어요.')} 
const fileToDataURL=b=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b)});
async function backup(){try{await saveQueue;toast('백업 파일을 준비하고 있어요.');const references=new Set();for(const x of state.journals)for(const ph of x.photos||[])references.add(ph.id);for(const x of state.documents)if(x.file?.id)references.add(x.file.id);for(const x of state.designs)if(x.photo?.id)references.add(x.photo.id);const files=[];for(const fileId of references){const f=await getFile(fileId);if(!f)throw Error('첨부 파일 일부를 찾을 수 없습니다. 백업을 중단합니다.');files.push({id:fileId,name:f.name,type:f.type,size:f.size,data:await fileToDataURL(f.blob)})}const backupData={app:'house-time',version:1,exported:timestamp(),state:JSON.parse(JSON.stringify(state)),files};const blob=new Blob([JSON.stringify(backupData)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='집의시간_전체백업_'+localDate()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);toast(`백업 생성 완료 · 기록과 파일 ${files.length}개 포함`)}catch(e){console.error(e);toast('백업 실패: '+(e.message||'저장 공간을 확인해 주세요.'))}}
function dataURLtoBlob(u){const m=/^data:([^;,]*)(?:;base64)?,(.*)$/s.exec(u);if(!m)throw Error('첨부 데이터 형식이 올바르지 않아요.');const mime=m[1]||'application/octet-stream';const raw=atob(m[2]);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}
function validateImported(obj){if(obj?.app!=='house-time'||obj?.version!==1||!obj.state||!Array.isArray(obj.files))throw Error('집의 시간에서 만든 백업 파일이 아닙니다.');for(const k of ['tasks','expenses','journals','documents','designs','contacts','care'])if(!Array.isArray(obj.state[k]))throw Error('백업 파일에 필요한 데이터가 없습니다.');if(!obj.state.project||typeof obj.state.project.title!=='string')throw Error('프로젝트 정보가 없습니다.');if(obj.files.length>2000)throw Error('첨부 파일이 너무 많습니다.');for(const f of obj.files)if(typeof f.id!=='string'||typeof f.data!=='string'||!f.data.startsWith('data:'))throw Error('첨부 데이터가 잘못되었습니다.');return true}
async function restore(file){if(!file)return;try{if(file.size>250*1024*1024)throw Error('250MB 이하 백업 파일만 복원할 수 있습니다.');const obj=JSON.parse(await file.text());validateImported(obj);if(!confirm(`백업 생성일: ${dateLabel(obj.exported?.slice(0,10))}\n할 일 ${obj.state.tasks.length}개, 기록 ${obj.state.journals.length}개, 첨부파일 ${obj.files.length}개를 불러옵니다.\n\n현재 이 브라우저의 모든 집짓기 기록이 교체됩니다. 계속할까요?`))return;
const knownFileIds=new Set(obj.files.map(f=>f.id));for(const e of obj.state.journals)for(const p of e.photos||[])if(!knownFileIds.has(p.id))throw Error('사진이 누락된 백업입니다.');for(const e of obj.state.documents)if(e.file?.id&&!knownFileIds.has(e.file.id))throw Error('문서가 누락된 백업입니다.');for(const e of obj.state.designs)if(e.photo?.id&&!knownFileIds.has(e.photo.id))throw Error('이미지가 누락된 백업입니다.');
const records=obj.files.map(f=>({id:f.id,blob:dataURLtoBlob(f.data),name:f.name,type:f.type,size:f.size,added:obj.exported}));await saveQueue;await new Promise((resolve,reject)=>{const tx=db.transaction(['attachments','meta'],'readwrite');const fs=tx.objectStore('attachments'),ms=tx.objectStore('meta');fs.clear();records.forEach(f=>fs.put(f,f.id));ms.put(obj.state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});state=obj.state;for(const url of objectURLs.values())URL.revokeObjectURL(url);objectURLs.clear();ui={page:'home',stage:'all',taskStatus:'all',budgetType:'all',journalType:'all',search:''};render();toast('전체 기록을 복원했어요.');}catch(e){console.error(e);toast('복원 실패: '+(e.message||'백업 파일을 확인해 주세요.'))}finally{$('#restoreInput').value=''}}
async function handleClick(e){const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navigate(nav.dataset.nav);return}const op=e.target.closest('[data-open]');if(op){openModal(op.dataset.open,op.dataset.id);return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action,key=a.dataset.id;try{if(action==='close-modal'){closeModal();return}if(action==='toggle-task'){const t=state.tasks.find(x=>x.id===key);if(t){t.status=t.status==='done'?'todo':'done';await saveState();render()}return}if(action==='toggle-care'){const t=state.care.find(x=>x.id===key);if(t){t.done=!t.done;await saveState();render()}return}if(action==='focus-stage'){ui.stage=a.dataset.stage;ui.taskStatus='all';document.querySelector('.task-tools')?.scrollIntoView({behavior:'smooth'});render();document.querySelector('.task-tools')?.scrollIntoView({behavior:'smooth',block:'center'});return}if(action==='task-filter'){ui.taskStatus=a.dataset.value;render();return}if(action==='journal-filter'){ui.journalType=a.dataset.value;render();return}if(action==='delete'){await deleteRow(a.dataset.kind,key);return}if(action==='download-file'){await downloadFile(key);return}if(action==='preview-file'){await previewFile(key);return}if(action==='delete-photo'){await deletePhoto(a.dataset.entry,key);return}if(action==='backup'){await backup();return}if(action==='restore'){$('#restoreInput').click();return}}catch(err){console.error(err);toast('처리 중 오류가 생겼습니다.')}}
async function init(){try{db=await openDB();state=await store('meta','readonly',s=>s.get('state'));if(!state){state=seed();await saveState()}if(!state.project||!Array.isArray(state.tasks))throw Error('보관 데이터가 올바르지 않습니다.');for(const k of ['expenses','journals','documents','designs','contacts','care'])if(!Array.isArray(state[k]))state[k]=[];$('#railMark').innerHTML=mark();$('#mobileMark').innerHTML=mark();ui.page=location.hash.slice(1)&&pages[location.hash.slice(1)]?location.hash.slice(1):'home';render();}catch(e){console.error('Initialization error',e);$('#mainContent').innerHTML=`<div class="banner warning"><h3>저장 공간을 열지 못했습니다</h3><p>이 앱은 브라우저 내부 저장소가 필요해요. 사생활 보호 모드가 아닌 일반 Safari/Chrome에서 열고 저장 공간을 확인해 주세요. 오류: ${esc(e.message)}</p></div>`;$('#railMark').innerHTML=mark();$('#mobileMark').innerHTML=mark();renderNav()}}
document.addEventListener('click',handleClick);document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();onForm(f)}});document.addEventListener('change',e=>{if(e.target.matches('[data-filter=stage]')){ui.stage=e.target.value;render()}if(e.target.matches('[data-filter=budgetType]')){ui.budgetType=e.target.value;render()}});$('#restoreInput').addEventListener('change',e=>restore(e.target.files?.[0]));$('#modalRoot').addEventListener('click',e=>{if(e.target===$('#modalRoot'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalRoot').classList.contains('hidden'))closeModal()});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(pages[p]&&p!==ui.page){ui.page=p;render()}});init();
})();
</script>
